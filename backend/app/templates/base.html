<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Milma Malappuram{% endblock %}</title>
  <script>
    // Apply saved theme BEFORE the page renders to avoid a flash of the
    // wrong theme on navigation. Falls back to dark if nothing saved.
    (function () {
      try {
        var t = localStorage.getItem("dashboard-theme");
        if (t !== "light" && t !== "dark") t = "dark";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { /* private mode — ignore */ }
    })();
  </script>
  <link rel="icon" type="image/png" href="/static/img/goose-icon.png?v=3">
  <link rel="apple-touch-icon" href="/static/img/goose-icon.png?v=3">
  <link rel="stylesheet" href="/static/vendor/css/pico.min.css">
  <link rel="stylesheet" href="/static/vendor/css/uplot.min.css">
  <link rel="stylesheet" href="/static/css/app.css?v=20">
  <script defer src="/static/vendor/js/alpine.min.js"></script>
  <script src="/static/vendor/js/htmx.min.js"></script>
  <script src="/static/vendor/js/uplot.iife.min.js"></script>
  <script src="/static/js/app.js"></script>
</head>
<body x-data x-init="$store.live.connect()" data-page="{{ page|default('') }}">
  <nav class="app-nav">
    <strong class="brand"><span class="brand-accent">Milma</span> Malappuram</strong>
    <div class="nav-tabs">
      <a href="/" class="nav-tab {% if page == 'live' %}active{% endif %}">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg>
        Live
      </a>
      <a href="/trends" class="nav-tab {% if page == 'trends' %}active{% endif %}">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 6-7"/></svg>
        Trends
      </a>
      <a href="/history" class="nav-tab {% if page == 'history' %}active{% endif %}">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        History
      </a>
      <a href="/settings" class="nav-tab {% if page == 'settings' %}active{% endif %}">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        Settings
      </a>
      <a href="/usage" class="nav-tab {% if page == 'usage' %}active{% endif %}">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/><path d="M12 16v4"/><path d="M7 10l2 2 3-4 3 3 2-2"/></svg>
        Usage
      </a>
      <a href="/about" class="nav-tab {% if page == 'about' %}active{% endif %}">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01"/><path d="M11 12h1v5h1"/></svg>
        About
      </a>
    </div>
    <span class="spacer"></span>
    <span class="live-status" title="WebSocket status">
      <span class="live-dot" :class="$store.live.connected ? 'on' : 'off'"></span>
    </span>
    <img src="/static/img/goose-logo.png?v=3" alt="Goose — The brand of Nature" class="company-logo">
  </nav>
  <main class="container-fluid">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
