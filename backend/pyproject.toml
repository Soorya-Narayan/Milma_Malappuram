[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "milma-aime-backend"
version = "0.1.0"
description = "AIME 8U dashboard backend — polls Modbus TCP RTUs, serves FastAPI + WebSocket + HTMX UI."
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "Milma Malappuram" },
]

# Major versions pinned per CLAUDE.md; `~=X.Y` allows patch/minor updates
# within the same major line but blocks breaking upgrades.
dependencies = [
    "fastapi~=0.115.0",
    "uvicorn[standard]~=0.32.0",
    "pymodbus~=3.7.0",
    "aiosqlite~=0.20.0",
    "sqlalchemy[asyncio]~=2.0.0",
    "openpyxl~=3.1.0",
    "fpdf2~=2.8.0",
    "psutil~=7.0",
    "pydantic-settings~=2.5.0",
    "jinja2~=3.1.0",
    "pyyaml~=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3.0",
    "pytest-asyncio~=0.24.0",
    "httpx~=0.27.0",
    "ruff~=0.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
